name = "MechInterp"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["MechInterp"]

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "MechInterp"
roots = ["MechInterp.All"]
globs = ["MechInterp.+"]

[[lean_lib]]
name = "Xorformer"
roots = ["Xorformer.Xorformer"]
globs = ["Xorformer.+"]
